name: Backend CI

on:
  push:
    branches:
      - master
      - main
      - backend-production
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript project
        run: npm run build

      - name: Run unit & security isolation tests
        run: npm test
        env:
          NODE_ENV: test
          PORT: 3002
          JWT_SECRET: ci-mock-secret-for-testing-purposes-only

  deploy:
    name: Backend Continuous Deployment
    needs: test-and-build
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Backend to Hosting Provider
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL || secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Starting backend deployment..."
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering deployment via Render Deploy Hook..."
            response=$(curl -s -w "\n%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')
            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "✅ Backend deployment triggered successfully (HTTP $http_code)"
            else
              echo "❌ Render Deploy Hook failed with HTTP $http_code: $body"
              exit 1
            fi
          elif [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            echo "Triggering deployment via Render REST API..."
            response=$(curl -s -w "\n%{http_code}" -X POST \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json")
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')
            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "✅ Backend deployment triggered successfully via Render API (HTTP $http_code)"
            else
              echo "❌ Render API returned HTTP $http_code: $body"
              exit 1
            fi
          else
            echo "::error::Backend hosting credentials not found in GitHub Secrets."
            echo "To enable automated backend deployment, add one of the following to Repository Secrets:"
            echo "  1. RENDER_BACKEND_DEPLOY_HOOK_URL (Recommended: Render Dashboard -> Web Service -> Settings -> Deploy Hook)"
            echo "  2. Or RENDER_API_KEY and RENDER_SERVICE_ID"
            exit 1
          fi
