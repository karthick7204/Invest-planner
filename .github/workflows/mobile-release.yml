name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - all
      profile:
        description: 'EAS build profile (configured in mobile/eas.json)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
          - development

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-mobile:
    name: Mobile EAS Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript
        run: npx tsc --noEmit

      - name: Set up EAS CLI
        run: npm install -g eas-cli

      - name: Build with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not configured in GitHub Secrets."
            echo "Please configure EXPO_TOKEN under repository Settings -> Secrets and variables -> Actions."
            echo "Generate a token at: https://expo.dev/settings/access-tokens"
            exit 1
          fi
          # Build mobile app binary via EAS without automatically publishing to App Store or Google Play
          eas build --platform ${{ github.event.inputs.platform }} --profile ${{ github.event.inputs.profile }} --non-interactive
